<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <nav>
      <ul>
          <div class="title">Registration Form</div>
          <a href="SearchTab.html" class="optionbttn">Search Tab</a>
      </ul>
    </nav>
    <form onsubmit="register(event)">
  <div class="registration" id="registration">
    <div class="user-details">
      <div class="input-box">
        <span class="details">First Name:</span>
        <input type="text" id="Fname" required><br>
      </div>
      <div class="input-box">
        <span class="details">Last Name:</span>
        <input type="text" id="Lname" required><br>
      </div>
      <div class="input-box">
        <span class="details">Middle Name:</span>
        <input type="text" id="Mname"><br>
      </div>
      <div class="input-box">
        <span class="details">Age:</span>
        <input type="text" id="Age"><br>
      </div>
      <div class="input-box">
        <span class="details">Position:</span>
        <input type="text" id="Position"><br>
      </div>
      <div class="input-box">
        <span class="details">Birthday:</span>
        <input type="date" id="bday"><br>
      </div>
      <div class="input-box">
        <span class="details">Email:</span>
        <input id="email" type="email" placeholder="Enter email" required><br>
      </div>
    </div>

    <div class="gender-details">
      <span>Gender:</span>
      <input class="dotone" type="radio" id="Male" name="Gender" value="Male">
      <span class="gender-title">Male</span>
      <input class="dotone" type="radio" id="Female" name="Gender" value="Female">
      <span class="gender-title">Female</span><br>
    </div>

    <div class="image-upload">
      <span>Upload Face Photo:</span>
      <input type="file" id="file" accept="image/jpeg,image/png"><br>
    </div>

    <button type="submit" class="register-btn">Register</button>
  </div>
</form>

  <script src="app.js"></script>

</body>
</html>
